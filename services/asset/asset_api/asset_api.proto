syntax = "proto3";

option go_package = "./;asset_api";

// Version: v1 (implicit). This package has no version suffix because it has
// never had a breaking change. When a breaking change is introduced, bump to
// package asset_api.v1 (or the next version) at that time -- not before.
package asset_api;

// swagger:enum Type
enum Type {
  NotUsedPING = 0; // Deprecated, previously used for WebSocket keepalive (not a P2P message)
  Subtree = 1;
  Block = 2;
  NotUsedMiningOn = 3; // Deprecated, previously used for MiningOn
  NodeStatus = 4;
}
